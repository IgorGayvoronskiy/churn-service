name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: churn}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/churn

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: read}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - uses: helm/kind-action@v1
        with: {cluster_name: ci}

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ci

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic churn-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/churn" 

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/churn-service api="$IMAGE"
          kubectl rollout status deploy/churn-service --timeout=120s

      - name: smoke
        run: |
          kubectl port-forward svc/churn-service 8080:80 &
          sleep 5

          curl --fail -s localhost:8080/health; echo
          curl --fail -s -X POST localhost:8080/v1/predict \
            -H "Content-Type: application/json" -d @good.json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert 0 <= r['score'] <= 1, r"; echo
          

          sleep 2

          kubectl exec deploy/postgres -- psql -U postgres -d churn \
            -tc "SELECT count(*) FROM predictions" | grep -q 1

      - name: диагностика
        if: failure()
        run: |
          echo "::group::Поды"
          kubectl get pods -o wide
          echo "::endgroup::"

          echo "::group::События кластера (по времени)"
          kubectl get events --sort-by=.lastTimestamp
          echo "::endgroup::"

          echo "::group::Деплойменты"
          kubectl get deploy -o wide
          echo "::endgroup::"

          for deploy in churn-service postgres; do
            echo "::group::describe deploy/$deploy"
            kubectl describe deploy/"$deploy" || true
            echo "::endgroup::"
          done

          for pod in $(kubectl get pods -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::describe pod/$pod (события конкретного пода)"
            kubectl describe pod/"$pod" || true
            echo "::endgroup::"

            echo "::group::logs pod/$pod (текущий контейнер)"
            kubectl logs pod/"$pod" --all-containers --tail=50 || true
            echo "::endgroup::"

            echo "::group::logs pod/$pod --previous (упавший перед рестартом контейнер)"
            kubectl logs pod/"$pod" --all-containers --previous --tail=50 || true
            echo "::endgroup::"
          done