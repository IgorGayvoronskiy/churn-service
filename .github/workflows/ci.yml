name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: churn}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/churn

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 20

    permissions: {contents: read, packages: read}

    env:
      KIND_CLUSTER: "churn-service"
      INGRESS_PORT: "30080"
      INGRESS_HOST: churn-service.localhost

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: kind, kubectl и доступ к кластеру
        run: |
          B=~/.local/bin && mkdir -p $B && echo "$B" >> "$GITHUB_PATH"
          [ -x $B/kind ] || curl -sSLo $B/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x $B/kubectl ] || curl -sSLo $B/kubectl https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x $B/kind $B/kubectl
          $B/kind export kubeconfig --name "$KIND_CLUSTER" --internal
          $B/kubectl get nodes

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic churn-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/churn" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/churn-service api="$IMAGE"
          kubectl rollout status deploy/churn-service --timeout=180s

      - name: smoke
        run: |
          set -o pipefail
          U="http://${KIND_CLUSTER}-control-plane:${INGRESS_PORT}"
          H="Host: ${INGRESS_HOST}"

          # 1. модель пришла из реестра: в /health версия вида churn-v<N>
          curl --fail -s --retry 5 --retry-all-errors -H "$H" "$U/health" | tee health.json; echo
          jq -e '.model_version | test("^churn-v[0-9]+$")' health.json

          # 2. проверка ответа (число от 0 до 1)
          curl --fail-with-body -sS -X POST -H "$H" "$U/v1/predict" \
            -H "Content-Type: application/json" -d @good.json | tee pred.json; echo
          jq -e '(.score | type == "number") and .score >= 0 and .score <= 1' pred.json

          # 3. в базе ровно одна строка с этим request_id
          sleep 2
          RID=$(jq -er .request_id pred.json)
          kubectl exec deploy/postgres -- psql -U postgres -d churn \
            -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'" | grep -qx 1

      - name: диагностика
        if: failure()
        run: |
          echo "::group::Поды"
          kubectl get pods -o wide
          echo "::endgroup::"

          echo "::group::События кластера (по времени)"
          kubectl get events --sort-by=.lastTimestamp
          echo "::endgroup::"

          echo "::group::Деплойменты"
          kubectl get deploy -o wide
          echo "::endgroup::"

          for deploy in churn-service postgres; do
            echo "::group::describe deploy/$deploy"
            kubectl describe deploy/"$deploy" || true
            echo "::endgroup::"
          done

          for pod in $(kubectl get pods -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::describe pod/$pod (события конкретного пода)"
            kubectl describe pod/"$pod" || true
            echo "::endgroup::"

            echo "::group::logs pod/$pod (текущий контейнер)"
            kubectl logs pod/"$pod" --all-containers --tail=50 || true
            echo "::endgroup::"

            echo "::group::logs pod/$pod --previous (упавший перед рестартом контейнер)"
            kubectl logs pod/"$pod" --all-containers --previous --tail=50 || true
            echo "::endgroup::"
          done
