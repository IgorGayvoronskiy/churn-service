[project]
name = "churn-service"
version = "0.1.7"
description = "Churn service"
requires-python=">=3.11,<3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary]",
    "catboost"
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "requests"
]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]