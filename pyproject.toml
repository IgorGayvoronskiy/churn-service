[project]
name = "churn-service"
version = "0.3.5"
description = "Churn service"
requires-python=">=3.11,<3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary]",
    "catboost",
    "mlflow-skinny>=3.16,<4",
    "skops>=0.11",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "requests"
]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных = адрес в DATABASE_URL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]